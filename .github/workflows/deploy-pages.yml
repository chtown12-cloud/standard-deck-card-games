name: Deploy to GitHub Pages

# Mirrors main to the gh-pages branch, which GitHub Pages serves.
# (The token can't enable Pages via the API, so branch publishing is used;
# if the site doesn't appear, set Settings > Pages > Source to the
# gh-pages branch once.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: git push --force origin HEAD:gh-pages
